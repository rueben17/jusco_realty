{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Jusco Realtors{% endblock %}</title>
  <meta name="description" content="{% block description %}Sales and lettings of prime residential property in Nairobi.{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="{% static 'js/tailwind.config.js' %}"></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="font-body text-ink antialiased">
{% block body %}{% endblock %}
<script src="{% static 'js/site.js' %}"></script>
</body>
</html>
